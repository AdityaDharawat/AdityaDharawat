<!DOCTYPE html>

<head>

  <title>Aditya Dharawat | LinkedIn</title>
  <style>

    body {
      display: grid;

  <script src="https://platform.linkedin.com/badges/js/profile.js" async defer type="text/javascript"></script>

<body>
  <main class="badge-shell" aria-label="LinkedIn profile badge">
    <div
      class="badge-base LI-profile-badge"
      data-locale="en_US"
      data-size="large"
      data-theme="light"
      data-type="HORIZONTAL"
      data-vanity="aditya-dharawat-b94757321"
      data-version="v1"
    >
      <a
        class="badge-base__link LI-simple-link"
        href="https://in.linkedin.com/in/aditya-dharawat-b94757321?trk=profile-badge"
