<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">AdityaDharawat.dev banner</title>
  <desc id="desc">Dark minimal banner with name</desc>
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#0d1117"/>
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" filter="url(#shadow)">
    <tspan x="50%" dy="-0.15em" font-size="64" font-weight="700" fill="#ffffff">AdityaDharawat</tspan>
    <tspan font-size="40" font-weight="300" font-style="italic" fill="#9aa3b2">.dev</tspan>
  </text>
</svg>
